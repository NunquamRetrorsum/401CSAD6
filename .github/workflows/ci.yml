# CI для hello-world-ts.
# Workflow навмисно мінімальний: уся логіка складання/тестування живе у ci.sh та ci.bat,
# щоб ті самі кроки можна було запустити локально без GitHub Actions.
name: CI

on:
  push:
    branches: [master, develop, "feature/**"]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build and test (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./ci.sh

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: ci.bat

      - name: Upload executable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hello-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
